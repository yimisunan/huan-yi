<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>场景交流 · 深渊天平</title>
<style>
:root{color-scheme:dark;--bg:#151b21;--panel:#202a33;--ink:#edf0ee;--muted:#b9c6c8;--accent:#adcbb8;--line:#3d4d57}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,sans-serif}button,input,textarea{font:inherit}button,a,input,textarea{touch-action:manipulation}button{min-height:44px;padding:8px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}a{color:var(--accent)}main{max-width:860px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}header{padding:16px 0 8px;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0}p{margin:8px 0}small,.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}details{margin-top:8px}summary{min-height:44px;cursor:pointer;padding:8px 0}fieldset{border:0;padding:8px 0;margin:0}.choices label{display:inline-flex;align-items:center;min-height:44px;margin-right:12px}input[type=checkbox]{width:20px;height:20px;margin-right:8px}input[type=text],textarea{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}#log{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 0;min-height:80px}article{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 30px 12px 0;overflow-wrap:anywhere;white-space:pre-wrap}article.player{margin:0 0 12px 30px;background:#293e39}article.action{background:transparent;border:0;border-left:2px solid var(--accent);border-radius:0;color:var(--muted)}article.narration{background:transparent;border:0;color:var(--muted);padding:6px 10px}article strong{display:block;color:var(--accent);font-size:14px}.handoff{border-left:3px solid var(--accent);padding:8px 12px}footer{border-top:1px solid var(--line);padding:10px 0 12px;background:var(--bg)}textarea{resize:vertical;min-height:80px;max-height:25dvh}#status{font-size:14px;min-height:24px;color:var(--muted)}#send{background:var(--accent);color:#15231c;border-color:var(--accent);margin-left:auto}#pending{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:14px}#setup[open]{max-height:45dvh;overflow:auto}dialog{max-width:95vw;max-height:95dvh;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px}dialog img{display:block;max-width:80vw;max-height:75dvh;object-fit:contain}dialog::backdrop{background:#000b}@media(max-width:480px){main{padding-left:12px;padding-right:12px}header{padding-top:10px}article{margin-right:16px}article.player{margin-left:16px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
<main><header><div class="row"><h1>场景交流</h1><a href="/">返回故事</a><button id="refresh">恢复记录</button></div><div id="sceneTitle" class="muted">建立一个场景，随时接话。</div><details id="setup"><summary>新建实验场景</summary><fieldset id="settings"><legend>在场人物（选择一至两位）</legend><div class="choices"><label><input type="checkbox" value="沈知韫" checked>沈知韫</label><label><input type="checkbox" value="苏婉青">苏婉青</label><label><input type="checkbox" value="徐念薇">徐念薇</label></div><label for="location">地点</label><input type="text" id="location" maxlength="80" value="客厅"><p><small>独立交流实验。移动、物品、任务与数值变化需转交完整回合。</small></p><button id="create">建立场景</button></fieldset></details></header>
<details id="connection"><summary>连接信息</summary><pre id="connectionText" style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px">展开后读取连接状态</pre></details>
<section id="log" aria-label="已接受的交流记录"><p class="muted">场景建立后，在下方输入你想说的话。</p></section><footer><div id="status" role="status" aria-live="polite">正在连接本地服务…</div><div id="pending"></div><div class="row"><button id="retry" hidden>重试原消息</button><button id="confirm" hidden>确认发送状态</button></div><form id="form"><label for="input">你的话</label><textarea id="input" maxlength="2000" placeholder="接着当前的话题说……"></textarea><div class="row"><small>回复接受后显示；点“播放”才合成语音。</small><button id="send" type="submit" disabled>发送</button></div></form></footer></main>
<script src="/voice_client.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='scene_chat_ui_v1';let cache;try{cache=JSON.parse(localStorage.getItem(key)||'{}')}catch{cache={}}let snapshot=null,posting=false,online=false,polling=false,signature='',audio=null,url=null,voiceSerial=0,playingButton=null;
$('input').value=cache.draft||'';const save=()=>localStorage.setItem(key,JSON.stringify(cache));const tell=t=>$('status').textContent=t;
async function api(path,body){return VoiceClient.requestJson('/api/story/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Story-Client':'1'},body:JSON.stringify(body)},12000)}
function controls(){const task=snapshot?.task,active=snapshot?.active||['queued','generating'].includes(task?.status);$('send').disabled=posting||!online||!snapshot?.scene||active||!!cache.pending;$('create').disabled=posting||active||!!cache.pending;$('retry').hidden=!['failed','interrupted'].includes(task?.status);$('retry').disabled=posting||!!cache.pending;$('confirm').hidden=!cache.pending;$('confirm').disabled=posting;$('pending').textContent=task&&['queued','generating','failed','interrupted'].includes(task.status)?'待处理：'+task.input:cache.pending?'待确认：'+cache.pending.input:''}
function stopVoice(){voiceSerial++;VoiceClient.cancel('scene');if(audio){audio.pause();audio.src='';audio=null}if(url)URL.revokeObjectURL(url);url=null;if(playingButton){playingButton.disabled=false;playingButton.textContent='播放';playingButton=null}}
async function play(m,button){stopVoice();const serial=voiceSerial;playingButton=button;button.disabled=true;button.textContent='准备语音…';try{const config=await VoiceClient.requestJson('/api/config');if(serial!==voiceSerial)return;const cfg=config[m.speaker]||config.default||{};if(!(cfg.voice||'').startsWith('fish:'))throw Error('该人物尚未配置Fish声音');const ttsText=String(m.text||'').replace(/[｛{]([^｜|}\r\n]+)[｜|]([^｝}\r\n]+)[｝}]/g,'$1');const blob=await VoiceClient.requestAudio(VoiceClient.buildPayload(ttsText,cfg,config.__settings__||{}),{channel:'scene',maxBytes:8*1024*1024});if(serial!==voiceSerial)return;url=URL.createObjectURL(blob);audio=new Audio(url);audio.onended=stopVoice;button.textContent='播放中';await audio.play()}catch(e){if(serial===voiceSerial){stopVoice();tell('语音未播放：'+e.message)}}}
function cleanDisplay(t){return String(t||'').replace(/\[[a-zA-Z][a-zA-Z0-9_,\s-]{0,79}\]/g,'').replace(/<\/?(?:whisper|emphasis|soft|fast|slow|stress|forceful|chinese|english|japanese|korean|cantonese|french|german|spanish)>/gi,'').replace(/<\|phoneme_start\|>[^<\r\n]{1,40}<\|phoneme_end\|>/g,'').replace(/<\|[^|\r\n]+\|>/g,'').replace(/[｛{]([^｜|}\r\n]+)[｜|]([^｝}\r\n]+)[｝}]/g,'$1（$2）').trim()}
function message(kind,speaker,text,m){const el=document.createElement('article');el.className=kind;const who=document.createElement('strong');who.textContent=kind==='action'?speaker+' · 动作':speaker||(kind==='narration'?'旁白':'');if(who.textContent)el.append(who);const body=document.createElement('span');body.textContent=cleanDisplay(text);el.append(body);if(m?.kind==='dialogue'){const row=document.createElement('div'),btn=document.createElement('button');btn.type='button';btn.textContent='播放';btn.addEventListener('click',()=>play(m,btn));row.append(btn);el.append(row)}$('log').append(el)}
function render(){const s=snapshot?.scene;if(!s){$('setup').open=true;controls();return}cache.sceneId=s.id;save();$('sceneTitle').textContent=s.location+' · '+s.cast.join(' / ')+' · '+s.revision+' 次交流';const next=s.id+':'+s.revision;if(next!==signature){const log=$('log'),near=log.scrollHeight-log.scrollTop-log.clientHeight<100||!signature;log.replaceChildren();for(const turn of s.history){message('player','徐志北',turn.input);for(const m of turn.messages)message(m.kind,m.speaker,m.text,m);if(turn.handoff){message('handoff','需转交完整回合',turn.handoff)}}signature=next;if(near)log.scrollTop=log.scrollHeight}const t=snapshot.task;if(cache.pending&&t?.id===cache.pending.request_id){cache.pending=null;save()}tell(t?.error||({queued:'已排队，等待Operit桥接。',generating:'正在回复，可继续编辑草稿。',committed:'已保存，可以继续接话。'}[t?.status])||'场景已就绪。');controls()}
async function restore(){if(polling||posting)return;polling=true;try{snapshot=await api('scene'+(cache.sceneId?'?id='+encodeURIComponent(cache.sceneId):''));online=true;render()}catch(e){online=false;tell(e.message);controls()}finally{polling=false}}
async function dispatch(){if(posting||!cache.pending)return;posting=true;controls();try{await api('scene/messages',cache.pending);tell('消息已送达，正在恢复状态。')}catch(e){if(e?.status>=400&&e?.status<500){cache.pending=null;save()}tell('发送状态待确认：'+e.message)}finally{posting=false;controls();await restore()}}
async function connection(){
 const scene=snapshot?.scene,task=snapshot?.task;
 const view={page_origin:location.origin,page_path:location.pathname,scene_id:scene?.id||null,revision:scene?.revision??null,task_id:task?.id||null,task_status:task?.status||null};
 try{Object.assign(view,await api('scene/connection'));}catch(e){view.connection_error=e.message;}
 $('connectionText').textContent=JSON.stringify(view,null,2);
}
$('connection').addEventListener('toggle',()=>{if($('connection').open)void connection()});
$('input').addEventListener('input',()=>{cache.draft=$('input').value;save()});$('refresh').onclick=restore;$('confirm').onclick=dispatch;
$('form').onsubmit=async event=>{event.preventDefault();if($('send').disabled||!$('input').value.trim())return;const uid=crypto.randomUUID?crypto.randomUUID():(Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));cache.pending={request_id:'scene-'+uid,scene_id:snapshot.scene.id,base_scene_revision:snapshot.scene.revision,input:$('input').value};cache.draft='';save();$('input').value='';await dispatch()};
$('create').onclick=async()=>{if(posting||$('create').disabled)return;posting=true;controls();try{const cast=[...$('settings').querySelectorAll('input[type=checkbox]:checked')].map(el=>el.value);snapshot=await api('scene',{cast,location:$('location').value});online=true;$('setup').open=false;stopVoice();render()}catch(e){tell(e.message)}finally{posting=false;controls()}};
$('retry').onclick=async()=>{if(posting)return;posting=true;controls();try{await api('scene/retry/'+encodeURIComponent(snapshot.task.id),{});}catch(e){tell(e.message)}finally{posting=false;await restore()}};
addEventListener('pagehide',stopVoice);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopVoice();else void restore()});setInterval(()=>{if(!document.hidden)void restore()},2500);void restore();
})();
</script></html>
