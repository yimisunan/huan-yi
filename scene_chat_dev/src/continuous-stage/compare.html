<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>深渊天平 · 三种聊天体验</title><link rel="stylesheet" href="compare.css"><script defer src="compare.js"></script></head><body data-mode="a">
<header class="toolbar"><a class="brand" href="/">深渊天平 <small>聊天交互演示</small></a><nav aria-label="切换演示方案"><button data-mode="a" aria-pressed="true">A 在场书页</button><button data-mode="b" aria-pressed="false">B 同席聊天</button><button data-mode="c" aria-pressed="false">C 此刻对话</button></nav><button id="reset">回到初始</button></header>
<div class="scenery" aria-hidden="true"><div class="window"></div><img class="person p0 active" data-person="沈知韫" src="/assets/沈知韫/fullbody.png" alt=""><img class="person p1" data-person="苏婉青" src="/assets/苏婉青/fullbody.png" alt=""><img class="person p2" data-person="徐念薇" src="/assets/徐念薇/fullbody.png" alt=""></div>
<section class="scene"><div class="overline">宅邸 · 会客厅 / 傍晚</div><h1 id="heading">雨停之前</h1><p id="modeDescription">人物在场，短句沿书页逐条留下。</p><div id="people" aria-label="同场人物，点击查看原立绘"></div><div class="scene-bottom"><span id="progress">初始状态 · 尚未发送</span><button id="history">聊天记录 <b id="count">1</b></button></div></section>
<main id="stream" tabindex="0" aria-label="现场消息"><div class="intro"><span>你们刚刚坐下。</span><p>聊天流里有三种东西：旁白交代现场，动作显示人物正在做什么，对白才是人物说出口的话。</p><div class="legend"><span class="legend-narration">旁白</span><span class="legend-action">动作</span><span class="legend-dialogue">对白</span><button id="playMix">播放混合示例</button></div></div><div id="messages" role="log" aria-live="polite" aria-relevant="additions"></div></main>
<section id="focus" aria-label="当前一句" hidden><div id="lastPlayer"></div><div id="currentMessage" aria-live="polite"></div><button id="replayLast">回看上一句</button></section>
<div id="arrival" role="status" aria-live="polite"></div><button id="jump" hidden>新消息 · 回到最新 ↓</button>
<footer><div class="quick"><span>试着说</span><button data-say="今天忙吗？">今天忙吗？</button><button data-say="那你先休息一下。">那先休息一下</button><button data-say="你们都在忙什么？">问问大家</button></div><form id="form"><label for="input">徐志北 <span>直接输入下一句</span></label><div class="write"><textarea id="input" rows="1" maxlength="2000" placeholder="说一句话……"></textarea><button id="send" type="submit">发送 ↗</button></div></form><div class="footnote"><span>预写短句演示 · 无模型请求</span><button id="restore">恢复上次记录</button><span id="hint">可连续接话</span></div></footer>
<dialog id="historyDialog"><div class="dialog-head"><h2>刚才的对话</h2><button data-close>关闭 ×</button></div><div id="historyList"></div></dialog><dialog id="portraitDialog"><div class="dialog-head"><h2 id="portraitName"></h2><button data-close>关闭 ×</button></div><img id="portrait" alt=""><div class="outfits"><button data-file="fullbody.png">外出立绘</button><button data-file="fullbody2.png">居家立绘</button><button data-file="into.png">人物图</button></div></dialog>
</body></html>
