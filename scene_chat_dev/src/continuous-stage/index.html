<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><meta name="theme-color" content="#171c1b"><title>深渊天平 · 此刻在场</title><link rel="stylesheet" href="stage.css"><script src="stage.js" defer></script></head>
<body>
<div class="room" aria-hidden="true"><div class="window"></div><div class="lamp"></div><div class="room-line"></div></div>
<div class="cast-stage" aria-hidden="true"><img data-person="苏婉青" class="figure left" alt="" src="/assets/苏婉青/fullbody.png"><img data-person="沈知韫" class="figure center active" alt="" src="/assets/沈知韫/fullbody.png"><img data-person="徐念薇" class="figure right" alt="" src="/assets/徐念薇/fullbody.png"></div>
<header class="topbar"><a class="brand" href="#" aria-label="深渊天平首页">深渊<span>天平</span></a><span class="demo-mark">独立交互演示</span><button id="openMenu" class="quiet" aria-label="打开演示控制">演示控制 <span aria-hidden="true">☰</span></button></header>
<aside class="scene-heading"><div class="eyebrow">此刻在场 <span class="rule"></span> SCENE 01</div><h1 id="sceneTitle">雨停之前</h1><p id="location">宅邸 · 会客厅 / 傍晚</p><p class="scene-note">一份还没翻开的账目，<br>和几个没有问出口的问题。</p><div class="cast-list" id="castList" aria-label="在场人物，点击查看立绘"></div><button id="openLedger" class="ledger-link">本段记录 <span id="recordCount">0</span> <span aria-hidden="true">↗</span></button><div class="speaker-caption" id="speakerCaption">沈知韫正在看向你</div></aside>
<main class="reading" id="reading" aria-label="连续场景记录" tabindex="0"><div class="reading-inner"><div class="chapter"><span>01 / THE UNOPENED FILE</span><h2>话还可以继续。</h2><p>你不必等一整段故事结束，才说下一句话。</p></div><div id="timeline" role="log" aria-label="现场对话"></div><div id="feedback" role="status" aria-live="polite"></div><div id="suggestions" class="suggestions" aria-label="接下来的行动建议"></div></div></main>
<button id="jumpLatest" class="jump" hidden>有新内容 · 回到此刻 ↓</button>
<footer class="composer-wrap"><form id="composer"><div class="composer-meta"><label for="draft">徐志北 <span>说点什么，或做一个决定</span></label><button type="button" id="resource" aria-label="查看演示额度说明">交流 <b id="quota">12</b> · 行动 <b id="energy">6</b></button></div><div class="input-row"><textarea id="draft" rows="1" maxlength="2000" placeholder="接着她的话说……"></textarea><button type="submit" class="send" id="send">发送 <span aria-hidden="true">↗</span></button></div><div class="composer-hint"><span>接受后 −1 交流 · 行动另行确认</span><span id="saveState">仅保存在本机演示</span></div></form></footer>
<dialog id="portraitDialog" class="portrait-dialog"><div class="dialog-top"><div><span class="eyebrow">人物 · 原始立绘</span><h2 id="portraitName"></h2></div><button class="quiet close-dialog" aria-label="关闭人物立绘">关闭 ×</button></div><div class="portrait-canvas"><img id="portraitImage" alt=""></div><div class="portrait-tabs"><button data-outfit="fullbody.png" aria-pressed="true">外出立绘</button><button data-outfit="fullbody2.png" aria-pressed="false">居家立绘</button><button data-outfit="into.png" aria-pressed="false">人物图</button></div></dialog>
<dialog id="ledgerDialog"><div class="dialog-top"><div><span class="eyebrow">这一段留下了什么</span><h2>本段记录</h2></div><button class="quiet close-dialog" aria-label="关闭本段记录">关闭 ×</button></div><div id="ledgerContent"></div><button id="endSection" class="primary">整理本段，继续交谈</button></dialog>
<dialog id="menuDialog"><div class="dialog-top"><h2>体验不同的下一步</h2><button class="quiet close-dialog" aria-label="关闭演示控制">关闭 ×</button></div><p class="muted">预写分支与本地状态，用于体验界面。不会请求模型，也不写入正式存档。所有消耗数字均为演示。</p><div class="demo-routes"><button data-route="group"><b>01 多人接话</b><span>同一个现场，不同人的回应</span></button><button data-route="investigate"><b>02 从一句话到行动</b><span>先看范围与消耗，再决定是否出发</span></button><button data-route="secret"><b>03 不能购买的答案</b><span>提问有回应，秘密仍有边界</span></button></div><label class="switch"><input type="checkbox" id="failNext">下一次发送模拟连接失败</label><button id="focusMode" class="wide quiet" aria-pressed="false">进入纯阅读模式</button><button id="reset" class="wide quiet">重置演示记录与额度</button></dialog>
</body></html>
